name: ci
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: 3.x
      - run: pip install mkdocs-material mkdocs
      - run: git config --global user.name "ryanwolf97"
      - run: git config --global user.email "ryanwolf97@users.noreply.github.com"
      - run: mkdocs gh-deploy --force
